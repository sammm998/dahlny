# Ritningsmängder från extern motor (SPEC 6.4.7). Data, inte kod.

vvs_engine:
  # Motorn körs som egen process i sin egen miljö (separat venv eller container), så att dess beroenden inte
  # blandas med VS-Kalkyls. Kommandot kan överstyras med miljövariabeln VVS_ENGINE_CMD.
  command: [vvs-takeoff]
  timeout_s: 1800
  supported_artifact_schemas: [3]
  # Motorns `confidence_tier` per rör → VS-Kalkyls konfidens 0–1. Ska kalibreras mot facit (fas 7).
  # Okänd nivå → 0.5 och flagga, aldrig ett påhittat högt värde.
  confidence_tiers:
    # motorns nivåer (pipes/confidence.py): sure = etikettens egen ledare (h.1, 0,95); inferred = härlett, t.ex.
    # etikett utan ledare (h.2, 0,8); review = granskas, t.ex. gren med ärvd, osäker dimension (h.3, 0,6)
    sure: 0.95
    inferred: 0.8
    review: 0.6
    verified: 0.95
    weak: 0.6
  unknown_tier_confidence: 0.5
  # Motorns evidence_state → hur raden behandlas
  confirmed_states: [CONFIRMED]
  verified_scale_states: [VERIFIED]
  # Motorns regler som styrs av VS-Kalkyls trösklar (skickas som --rule ID=VÄRDE). SPEC 6.4.3 h.
  rules_from_thresholds:
    semantics.proximity.LEADERLESS_MM: assign.proximity_max_mm_paper
    semantics.proximity.CONFIDENCE: assign.proximity_confidence
    semantics.proximity.AMBIGUITY_RATIO: assign.proximity_ambiguity_ratio
    semantics.proximity.PARALLEL_DEG: assign.proximity_parallel_deg
