# Alla trösklar samlade här – inga magiska tal i koden (SPEC 12).
# Längder "på papper" anges i mm och räknas om till PDF-punkter via ritningens pappersskala.

ingest:
  render_overview_dpi: 100
  render_work_dpi: 300
  render_crop_dpi: 600
  classify_text_chars: 2000          # 6.1.4 – textlagrets första N tecken till T1
  overview_max_px: 1568              # översiktsbild till T1: längsta sida i pixlar
  min_vector_paths_for_vector_page: 50
  raster_min_image_coverage: 0.6     # 6.1.2 – en bild som täcker ≥ 60 % av sidan = rasterunderlag
  raster_max_vector_paths: 50        # ... och få vektorer → pdf_raster; många vektorer ovanpå → pdf_mixed
  min_text_chars_for_text_layer: 20
  max_zip_members: 500
  max_zip_uncompressed_mb: 2000

classify:
  rule_confidence: 0.9               # deterministisk regel som slår till (t.ex. "RITNINGSFÖRTECKNING")
  ai_min_confidence: 0.8             # T1 under detta → eskalera, sedan granskning
  agreement_confidence: 0.98         # regel och AI överens
  auto_accept_confidence: 0.85       # klassning/titelblock under detta → granskning
  document_majority_fraction: 0.8    # oklassad sida ärver dokumentets typ om minst så stor andel delar den
  document_inherit_confidence: 0.85

raster_quality:
  min_text_height_px: 20             # 6.4.4 – lägre → endast manuell mängdning
  recommended_rescan_dpi: 300

tiles:
  size_px: 1024
  overlap_fraction: 0.20
  min_text_height_px: 12             # 7.2 – minsta texthöjd i tile
  dedupe_iou: 0.5                    # 6.4.3 c.2 – slå ihop dubbletter från överlapp
  dpi: 300                           # 6.4.3 c.2 – 300–400 dpi
  reread_dpi: 600                    # 6.4.3 c.3 – omläsning av en etikett där läsningarna inte enas
  reread_margin_pt: 4.0              # marginal runt etiketten i omläsningsutsnittet
  cut_text_grow: 0.5                 # 7.4 – tile_has_cut_text: bitens sida växer med denna andel och läses om
  blank_ink_fraction: 0.0005         # bitar med mindre andel mörka pixlar än så hoppas över (tomt papper)
  ink_threshold: 160                 # gråvärde under detta räknas som bläck
  edge_margin_pt: 2.0                # läsning närmare bitens inre kant än så räknas som möjligen avskuren

labels:
  min_read_confidence: 0.8           # 6.4.3 c.3 – under → granskning
  pair_iou: 0.3                      # vision- och OCR-läsning av samma etikett: överlapp i sidkoordinater
  agree_confidence: 0.98             # vision och OCR läser tecken för tecken lika
  reread_confidence: 0.85            # omläsningen valde en av läsningarna med hög säkerhet
  single_reader_cap: 0.75            # bara en läsare såg etiketten → alltid under granskningsgränsen
  ocr_min_score: 0.5                 # OCR-ord under denna säkerhet används inte
  new_style_unknown_token_fraction: 0.10   # 8.3

scale:
  max_disagreement_fraction: 0.01    # 6.4.3 f – två metoder inom 1 %

graph:
  snap_tolerance_mm_paper: 0.5       # 6.4.3 g.1
  direction_change_deg_fitting: 30   # 6.4.3 l – böj vid riktningsändring > 30°

assign:
  leader_end_tolerance_mm_paper: 1.0 # 6.4.3 h.1
  leader_confidence: 0.95
  leader_capture_factor: 2.0        # h.1 – ledarände utan rör fångas av närmaste rör inom 2 × leader_end_tolerance
  leader_capture_confidence: 0.7
  proximity_max_mm_paper: 6.0        # 6.4.3 h.2
  proximity_confidence: 0.8
  proximity_ambiguity_ratio: 1.5
  proximity_parallel_deg: 10.0       # h.2 – så mycket får röret avvika från textens riktning och vara parallellt
  branch_inherited_dim_confidence: 0.6   # h.3
  branch_legend_dim_confidence: 0.85     # h.3
  max_unassigned_length_fraction: 0.02   # h.5 / UNASSIGNED_PIPE

raster_paths:
  max_confidence_scan: 0.85          # 6.4.4.5 väg D
  max_confidence_photo: 0.75         # 6.4.4.5 väg E

matching:
  score_rsk_exact: 1.0               # 6.3
  score_supplier_art_no_exact: 0.98
  fuzzy_top_k: 20
  stock_min_score: 0.95
  request_below_score: 0.6
  rerank_escalate_min: 0.6           # 7.1 T6 – eskalera vid 0.6–0.95
  rerank_escalate_max: 0.95

quantities:
  material_from_system_confidence: 0.85  # beslut 2026-11-03 – systemets enda material i projektet (TB + etiketter)
