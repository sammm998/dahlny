# Modellval per AI-uppgift (SPEC 7.1). Byts utan kodändring.
# Verifiera modell-ID, priser och funktioner i leverantörens dokumentation före driftsättning.
#
# Noteringar (Anthropic, nuvarande modeller):
# - temperature/top_p/top_k stöds inte längre (400). Determinism uppnås i stället genom
#   cache på (task_id, model, prompt_version, input_hash) i AIRun.
# - Tvingat tool_choice ("any"/"tool") ger 400 på opus-5-5 / sonnet-5-5 / fable-5-1.
#   Strukturerade svar görs därför med output_config.format (json_schema) och valideras med Pydantic.
# - effort styr tänkande/kostnad. Opus 5.5 och Haiku 5.5 har default "medium" – sätt explicit.

version: 1

defaults:
  max_tokens: 16000
  sdk_max_retries: 4          # SDK:ns exponentiella backoff vid 408/409/429/5xx/nätverksfel
  timeout_s: 600
  validation_retries: 1       # nytt försök med valideringsfelet bifogat, sedan eskalering
  max_concurrency: 8          # samtidiga AI-anrop i en körning (T5: bitar och utsnitt); 429 hanteras av SDK:n

# Kostnadstak per projekt (SPEC 7.2). Överskrids → AIClient vägrar nya anrop (CostCapExceeded).
cost_cap_usd_per_project: 30.0   # beslut 2026-11-02; används också som tak för mätkörningar utan projekt
# Tak för etikettläsningen (T5T/T5/T5R/T5X) per ritningsblad. Nås det läses resten av bladet bara med OCR
# (flaggat för granskning). Beslut 2026-11-02: under 1 USD per ritning.
labels_budget_usd_per_sheet: 1.0
# Vad Sonnet läser i T5:
#   all    = varje bit med bläck (ingen OCR-grind, ingen Haiku) – baslinjen, beslut 2026-11-03 (Bilaga A: 87/88)
#   tiles  = bitar med OCR-text som Haiku (T5T) sorterat som svåra
#   labels = bara utsnitt där Haiku och OCR inte enas (T5R) – billigast, men Haiku och OCR kan göra samma fel
#            och godkännas tillsammans (Bilaga A: `Z` för `2`, `S01-P2` för `S01-P2-110`); därför inte standard
labels_routing: all

providers:
  anthropic:
    # Serverside fallback vid refusal (beta). Det modell-ID som faktiskt svarade loggas i AIRun.served_model.
    server_side_fallback: true
  openai: {}
  google: {}

# Priser i USD per miljon tokens. null = okänt → cost_estimate loggas som null.
models:
  claude-fable-5-1:  {provider: anthropic, input: 10.0, output: 50.0, cache_read: 0.25, cache_write: 12.5, supports_temperature: false}
  claude-opus-5-5:   {provider: anthropic, input: 4.0,  output: 20.0, cache_read: 0.20, cache_write: 5.0,  supports_temperature: false}
  claude-sonnet-5-5: {provider: anthropic, input: 2.0,  output: 10.0, cache_read: 0.20, cache_write: 2.5,  supports_temperature: false}
  claude-haiku-5-5:  {provider: anthropic, input: 0.10, output: 0.50, cache_read: 0.01, cache_write: 0.125, supports_temperature: false}
  # Kandidater i bakeoff (SPEC 7.5) läggs till här först när modell-ID, pris och avtal
  # verifierats (ÖPPEN FRÅGA 11), t.ex.:
  # <openai-modell>: {provider: openai, input: null, output: null, cache_read: null, cache_write: null, supports_temperature: false}

tasks:
  T0:   # Internt rökprov för fas 0 (make ai-smoke). Ingen domänlogik.
    model: claude-haiku-5-5
    escalation: []
    effort: low
    max_tokens: 1024
    description: Rökprov – verifierar att AI-anrop, validering och AIRun-loggning fungerar.
  T1:
    model: claude-haiku-5-5
    escalation: [claude-sonnet-5-5]
    effort: low
    max_tokens: 2048
    description: Sidklassning
  T2:
    model: claude-sonnet-5-5
    escalation: [claude-opus-5-5]
    effort: medium
    description: Titelblock + legendtabeller (vision)
  T3:
    model: claude-sonnet-5-5
    escalation: [claude-opus-5-5]
    effort: medium
    description: TB-strukturering
  T2L:  # Legendtabeller på ritningen (FÖRKLARINGAR, MATRIS FÖR ISOLERING), SPEC 6.4 / A.5
    model: claude-sonnet-5-5
    escalation: [claude-opus-5-5]
    effort: medium
    description: Tabell på ritning (vision) – rubriker och celler ordagrant
  T3G:  # Generella krav (ProjectRule) ur hela TB:n, SPEC 6.2 steg 7
    model: claude-sonnet-5-5
    escalation: [claude-opus-5-5]
    effort: medium
    description: Generella krav ur TB (ProjectRule), varje krav med ordagrant citat
  T4:
    model: claude-opus-5-5
    escalation: []
    effort: high
    description: TB-fullständighetskontroll (annan modell än T3)
  T5T:  # Sortering av ritningsbitar (beslut 2026-11-02): bara svåra bitar går till T5
    model: claude-haiku-5-5
    escalation: []
    effort: low
    max_tokens: 8192
    description: Sorterar en ritningsbit som tom, enkel eller svår och läser etiketterna i enkla bitar
  T5:
    model: claude-sonnet-5-5   # beslut 2026-11-02 (Bilaga A: 87/88 exakt); Opus bara via T5R:s eskalering
    escalation: []
    effort: high
    description: Etikettläsning på svåra ritningsbitar (vision)
  T5R:  # Omläsning av en enskild etikett där läsarna inte enas (SPEC 6.4.3 c.3, 7.1 eskalering)
    model: claude-sonnet-5-5
    escalation: [claude-opus-5-5]   # beslut 2026-11-03: Opus bara när Sonnet inte kan avgöra en oenighet
    max_tokens: 4096
    description: Omläsning av etikett i 600 dpi med båda läsningarna som alternativ
  T6:
    model: claude-haiku-5-5
    escalation: [claude-sonnet-5-5]
    effort: low
    max_tokens: 4096
    description: Artikel-rerank (väljer bara bland kandidater)
  T7:
    model: claude-sonnet-5-5
    escalation: []
    effort: medium
    description: Lager-/systemmappning (DXF/IFC)
  T8:
    model: claude-opus-5-5
    escalation: []
    effort: high
    description: Vektorgruppsklassning (vision)
  T9:
    model: claude-sonnet-5-5
    escalation: []
    effort: medium
    description: Mailutkast
  T10:
    model: claude-sonnet-5-5
    escalation: []
    effort: medium
    description: Pris ur leverantörssvar
