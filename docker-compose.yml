# Lokal utvecklingsmiljö (SPEC 4: PostgreSQL 16 + PostGIS + pg_trgm, Redis, MinIO).
#   make db-up     – bara databas, redis och minio (backend körs lokalt med make dev)
#   docker compose up --build   – allt i containrar
name: vs-kalkyl

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: vskalkyl
      POSTGRES_PASSWORD: vskalkyl
      POSTGRES_DB: vskalkyl
    ports: ["${DB_PORT:-5432}:5432"]
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/initdb.sql:/docker-entrypoint-initdb.d/10-initdb.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vskalkyl -d vskalkyl"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["${REDIS_PORT:-6379}:6379"]

  # Objektlagring används från fas 1 (originalfiler, renderingar). MinIO publicerar sina images på
  # quay.io (inte längre på Docker Hub). Startas med `docker compose --profile storage up`.
  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: [storage]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["${MINIO_PORT:-9000}:9000", "${MINIO_CONSOLE_PORT:-9001}:9001"]
    volumes: [minio-data:/data]

  backend:
    build: {context: ., dockerfile: backend/Dockerfile}
    env_file: [{path: .env, required: false}]
    environment:
      DATABASE_URL: postgresql+psycopg://vskalkyl:vskalkyl@db:5432/vskalkyl
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports: ["${API_PORT:-8000}:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}

  worker:
    build: {context: ., dockerfile: backend/Dockerfile}
    env_file: [{path: .env, required: false}]
    environment:
      DATABASE_URL: postgresql+psycopg://vskalkyl:vskalkyl@db:5432/vskalkyl
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
    command: celery -A app.jobs.celery_app worker --loglevel=info
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}

volumes:
  db-data:
  minio-data:
